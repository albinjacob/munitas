name: verify

# Runs the real verification suite (verify/run_all.py) against the actual
# Docker Compose stack, the same way run-verification.ps1 does it locally:
# inside the munitas-api container, where it can reach Postgres, Temporal,
# OPA, and sign S3 requests against SeaweedFS. GitHub's ubuntu-latest runners
# have Docker natively, so none of the WSL2 indirection this repo's local
# dev scripts need on Windows applies here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env defaults
        # Required by docker-compose.yml, and a shell variable beats the
        # Windows-style example in .env.example, which Linux cannot use.
        # $RUNNER_TEMP (a real environment variable once a runner is
        # assigned) rather than the ${{ runner.temp }} expression: that
        # expression's context isn't available yet when a job-level env:
        # block is evaluated, only from within a step.
        run: |
          echo "MUNITAS_DATA=$RUNNER_TEMP/munitas-data" >> "$GITHUB_ENV"
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/munitas-data"

      - name: Render kratos.yml and .env's ports block
        # infra/kratos/kratos.yml is gitignored (generated, not committed,
        # see scripts/render_ports_env.py's own docstring), and Kratos reads
        # it directly with no ${VAR} expansion of its own. Without this,
        # kratos-migrate fails immediately: "open
        # /etc/config/kratos/kratos.yml: no such file or directory".
        run: python3 scripts/render_ports_env.py

      - name: Bring up the backend stack
        run: docker compose up -d postgres seaweedfs temporal opa kratos-migrate kratos munitas-api

      - name: Wait for munitas-api to be healthy
        # docker-compose.yml only defines a healthcheck for postgres, not for
        # munitas-api itself, so `docker compose ps --format '{{.Health}}'`
        # would never report anything and this loop would just time out.
        # Polling the API's own GET /health directly is what actually proves
        # readiness.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "munitas-api is healthy"
              exit 0
            fi
            echo "waiting for munitas-api ($i/60)..."
            sleep 5
          done
          echo "munitas-api never became healthy"
          docker compose logs munitas-api
          exit 1

      - name: Start MLflow and wait for it
        # In the 'full' profile, so the `up` above does not start it, but
        # U61 (a de-identification run) refuses to run and reports its
        # checks as skipped while the score store is down. start-dev.ps1
        # starts it the same way. It installs its database driver on every
        # start, so it answers later than the API; the wait is bounded and
        # failing it fails the job rather than silently skipping U61.
        run: |
          docker compose --profile full up -d mlflow
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "mlflow is healthy"
              exit 0
            fi
            echo "waiting for mlflow ($i/60)..."
            sleep 5
          done
          echo "mlflow never became healthy"
          docker compose logs mlflow
          exit 1

      - name: Seed Kratos identities and the worked examples
        # A fresh volume (every CI run) has directory rows from
        # infra/postgres/seed-organisation.sql/seed-canary.sql/seed-finance.sql
        # (auto-run by Postgres on an empty data directory) but no matching
        # real Kratos account for any of them yet, and real login is the
        # console's only identity mechanism -- see RUNBOOK.md's "Connecting
        # real logins to directory rows". Without this, most of the suite
        # fails at the first Kratos login with HTTP 400. seed-identities.py
        # talks to Postgres directly and to Kratos's admin API; the two
        # example-seed scripts talk only to the already-healthy API, and
        # need the identities seeded first since they sign in for real.
        # All three are idempotent (RUNBOOK.md, same section, and each
        # script's own docstring). seed-health-example.py also imports
        # worker/run_pipeline.py (to register the pipeline steps), whose
        # import chain needs temporalio and boto3 on top of the HTTP and
        # Postgres clients; the pins match worker/requirements.txt.
        run: |
          pip install --quiet httpx==0.27.2 "psycopg[binary]==3.2.1" \
            temporalio==1.7.0 boto3==1.35.24
          python3 infra/kratos/seed-identities.py
          python3 scripts/seed/seed-health-example.py
          python3 scripts/seed/seed-finance-example.py

      - name: Run the verification suite
        # A skipped check is not a pass (verify/common.py), and a green run
        # can still contain skips: the host worker, a GPU, real R2 keys and
        # a sandbox are not available on a runner, so the checks that need
        # them report [SKIP]. Counted and printed in the job summary so a
        # green run cannot be read as "everything ran".
        run: |
          set +e
          docker compose exec -T munitas-api python /verify/run_all.py 2>&1 | tee suite.log
          code=${PIPESTATUS[0]}
          skipped=$(grep -c '\[SKIP\]' suite.log)
          {
            echo "### Verification suite"
            echo "- Exit code: $code"
            echo "- Skipped checks (not passes): $skipped"
            grep '\[SKIP\]' suite.log | sed 's/^ *//; s/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped checks (not passes): $skipped"
          exit $code

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # Playwright's real suites (tests/console.spec.ts, tests/real-auth.spec.ts,
      # etc.) need the dev server running in one of two auth modes against a
      # live Kratos + API, per web/README.md. Wiring that into CI is real work
      # (seeding identities, choosing a mode per suite) and is deliberately
      # not attempted here yet -- this job only proves the console still
      # builds and lints cleanly.

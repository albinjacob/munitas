name: verify

# Runs the real verification suite (verify/run_all.py) against the actual
# Docker Compose stack, the same way run-verification.ps1 does it locally:
# inside the munitas-api container, where it can reach Postgres, Temporal,
# OPA, and sign S3 requests against SeaweedFS. GitHub's ubuntu-latest runners
# have Docker natively, so none of the WSL2 indirection this repo's local
# dev scripts need on Windows applies here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that pinned versions agree across files
        # The requirements files and this workflow repeat some pins, and each
        # says its pins match the others. This is what makes that true: it
        # needs nothing installed and fails in seconds, before any container
        # is started.
        run: python3 scripts/check_pins_agree.py

      - name: Copy env defaults
        # Required by docker-compose.yml, and a shell variable beats the
        # Windows-style example in .env.example, which Linux cannot use.
        # $RUNNER_TEMP (a real environment variable once a runner is
        # assigned) rather than the ${{ runner.temp }} expression: that
        # expression's context isn't available yet when a job-level env:
        # block is evaluated, only from within a step.
        run: |
          echo "MUNITAS_DATA=$RUNNER_TEMP/munitas-data" >> "$GITHUB_ENV"
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/munitas-data"

      - name: Render kratos.yml and .env's ports block
        # infra/kratos/kratos.yml is gitignored (generated, not committed,
        # see scripts/render_ports_env.py's own docstring), and Kratos reads
        # it directly with no ${VAR} expansion of its own. Without this,
        # kratos-migrate fails immediately: "open
        # /etc/config/kratos/kratos.yml: no such file or directory".
        run: python3 scripts/render_ports_env.py

      - name: Bring up the backend stack
        run: docker compose up -d postgres seaweedfs temporal opa kratos-migrate kratos munitas-api

      - name: Wait for munitas-api to be healthy
        # docker-compose.yml only defines a healthcheck for postgres, not for
        # munitas-api itself, so `docker compose ps --format '{{.Health}}'`
        # would never report anything and this loop would just time out.
        # Polling the API's own GET /health directly is what actually proves
        # readiness.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "munitas-api is healthy"
              exit 0
            fi
            echo "waiting for munitas-api ($i/60)..."
            sleep 5
          done
          echo "munitas-api never became healthy"
          docker compose logs munitas-api
          exit 1

      - name: Start MLflow and wait for it
        # In the 'full' profile, so the `up` above does not start it, but
        # U61 (a de-identification run) refuses to run and reports its
        # checks as skipped while the score store is down. start-dev.ps1
        # starts it the same way. It installs its database driver on every
        # start, so it answers later than the API; the wait is bounded and
        # failing it fails the job rather than silently skipping U61.
        run: |
          docker compose --profile full up -d mlflow
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "mlflow is healthy"
              exit 0
            fi
            echo "waiting for mlflow ($i/60)..."
            sleep 5
          done
          echo "mlflow never became healthy"
          docker compose logs mlflow
          exit 1

      - name: Install Python dependencies
        # What a developer's own .venv already holds and a fresh runner does
        # not. Needed by the seed scripts (seed-health-example.py imports
        # worker/run_pipeline.py) and by the worker started below. Pins
        # match worker/requirements.txt; langgraph and the opentelemetry
        # packages are what the agent package imports (agent/graph.py,
        # agent/tracing.py); their pins are declared in
        # worker/requirements.txt too; scripts/check_pins_agree.py, the
        # first step above, fails if they differ. Only
        # what worker.main needs to import and serve its queues, plus
        # huggingface_hub (imported inside hf_ingest_activities.py's fetch,
        # so an import test cannot see it; found by scanning every import in
        # worker/ and agent/) is installed. The speech and detection stack
        # (faster_whisper, gliner, spacy, presidio, torch, soundfile, numpy,
        # mlflow) is not: nothing in this suite runs a real
        # de-identification, U61 stops its run at once.
        run: |
          pip install --quiet httpx==0.27.2 "psycopg[binary]==3.3.4" \
            temporalio==1.7.0 boto3==1.35.24 docker==7.1.0 "huggingface_hub>=0.34" \
            langgraph==0.2.39 langgraph-checkpoint-postgres==2.0.25 \
            opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0 \
            opentelemetry-exporter-otlp-proto-grpc==1.44.0

      - name: Work out where Temporal's test server is kept, and under what cache key
        id: temporal
        # The retry-behaviour test below needs Temporal's test server, a 60 MB
        # binary the SDK downloads from temporal.download. Keeping it in the
        # Actions cache means a run after the first does not depend on that host
        # being reachable. The key carries the pinned temporalio version, read
        # from the requirements file rather than written out again here, so an
        # upgrade changes the key and fetches the matching server by itself.
        run: |
          version=$(grep -oP '^temporalio==\K[0-9][0-9.]*' worker/requirements.txt)
          test -n "$version" || { echo "no temporalio pin found in worker/requirements.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/temporal-test-server" >> "$GITHUB_OUTPUT"

      - name: Restore Temporal's test server from the cache
        id: test-server-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.temporal.outputs.dir }}
          key: temporal-test-server-${{ runner.os }}-${{ steps.temporal.outputs.version }}

      - name: Check the pipeline workflow's retry behaviour
        # Runs the real DeidentificationPipeline against Temporal's in-process
        # test server with fake activities, one of which goes silent like a
        # killed worker. Needs no running stack and takes about half a minute.
        # This is not the by-hand kill test (RUNBOOK.md), it checks the
        # workflow's retry and heartbeat settings, not that the real steps are
        # safe to repeat. Exit 3 means the test server could not be started:
        # nothing was tested, and that is not a failure of the workflow.
        env:
          MUNITAS_TEST_SERVER_DIR: ${{ steps.temporal.outputs.dir }}
        run: python3 verify/v6c_retry_policy.py

      - name: Save Temporal's test server to the cache
        # Only after the test passed, so a partly downloaded file from a failed
        # run is never cached, and only on a miss: a cache entry cannot be
        # overwritten, so saving over a hit would only fail.
        if: steps.test-server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.temporal.outputs.dir }}
          key: temporal-test-server-${{ runner.os }}-${{ steps.temporal.outputs.version }}

      - name: Seed Kratos identities and the worked examples
        # A fresh volume (every CI run) has directory rows from
        # infra/postgres/seed-organisation.sql/seed-canary.sql/seed-finance.sql
        # (auto-run by Postgres on an empty data directory) but no matching
        # real Kratos account for any of them yet, and real login is the
        # console's only identity mechanism -- see RUNBOOK.md's "Connecting
        # real logins to directory rows". Without this, most of the suite
        # fails at the first Kratos login with HTTP 400. seed-identities.py
        # talks to Postgres directly and to Kratos's admin API; the two
        # example-seed scripts talk only to the already-healthy API, and
        # need the identities seeded first since they sign in for real.
        # All three are idempotent (RUNBOOK.md, same section, and each
        # script's own docstring). Packages come from the step above.
        run: |
          python3 infra/kratos/seed-identities.py
          python3 scripts/seed/seed-health-example.py
          python3 scripts/seed/seed-finance-example.py

      - name: Start the worker and wait for it
        # The suite's HuggingFace, agent-run and pipeline checks need a
        # Temporal worker polling; without one U43 fails, U61 is refused
        # with HTTP 503, and nine other checks skip after a long timeout.
        # Locally start-dev.ps1 starts the same module. MUNITAS_DATA (set in
        # the first step) gives it its work folder. The wait is bounded, and
        # a worker that dies at start-up fails the job with its own log.
        run: |
          nohup python3 -m worker.main > worker.log 2>&1 &
          echo $! > worker.pid
          for i in $(seq 1 30); do
            if grep -q "worker ready on task queues" worker.log; then
              echo "worker is ready"
              exit 0
            fi
            if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
              echo "worker exited during start-up"
              cat worker.log
              exit 1
            fi
            sleep 2
          done
          echo "worker never reported ready"
          cat worker.log
          exit 1

      - name: Run the verification suite
        # A skipped check is not a pass (verify/common.py), and a green run
        # can still contain skips: the host worker, a GPU, real R2 keys and
        # a sandbox are not available on a runner, so the checks that need
        # them report [SKIP]. Counted and printed in the job summary so a
        # green run cannot be read as "everything ran".
        run: |
          set +e
          docker compose exec -T munitas-api python /verify/run_all.py 2>&1 | tee suite.log
          code=${PIPESTATUS[0]}
          skipped=$(grep -c '\[SKIP\]' suite.log)
          {
            echo "### Verification suite"
            echo "- Exit code: $code"
            echo "- Skipped checks (not passes): $skipped"
            grep '\[SKIP\]' suite.log | sed 's/^ *//; s/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped checks (not passes): $skipped"
          exit $code

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== worker ==="
          cat worker.log 2>/dev/null || echo "no worker log"
          docker compose logs

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # Playwright's real suites (tests/console.spec.ts, tests/real-auth.spec.ts,
      # etc.) need the dev server running in one of two auth modes against a
      # live Kratos + API, per web/README.md. Wiring that into CI is real work
      # (seeding identities, choosing a mode per suite) and is deliberately
      # not attempted here yet -- this job only proves the console still
      # builds and lints cleanly.

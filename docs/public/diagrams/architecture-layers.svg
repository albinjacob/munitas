<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1396 960" width="1396" height="960" role="img" aria-labelledby="diagram-title diagram-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="diagram-title">Munitas in layers</title>
<desc id="diagram-desc">A layered picture of Munitas. People work through the Console and notebooks. Governance decides every request: sign-in, the policy engine and the API. Processing runs pipelines and jobs, and three kinds of code that are not the platform&#x27;s own, in places with restricted reach. Storage holds files, tables and the keys for locked data. One record of every decision runs across all the layers.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1A5FA8"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#B03030"/></marker>
</defs>
<rect x="0" y="0" width="1396" height="960" fill="#F6F4EC"/>
<rect x="40" y="24" width="1028" height="150" rx="10" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="64" y="160" font-size="12" font-weight="700" fill="#1F5D68">People and tools</text>
<rect x="40" y="210" width="1028" height="150" rx="10" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="64" y="346" font-size="12" font-weight="700" fill="#1F5D68">Governance</text>
<rect x="40" y="396" width="1028" height="150" rx="10" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="64" y="532" font-size="12" font-weight="700" fill="#1F5D68">Processing</text>
<rect x="40" y="582" width="1028" height="150" rx="10" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="64" y="718" font-size="12" font-weight="700" fill="#1F5D68">Storage</text>
<rect x="1108" y="24" width="248" height="708" rx="10" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="1132" y="718" font-size="12" font-weight="700" fill="#1F5D68">Across every layer</text>
<rect x="324" y="48" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="424.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Console</text>
<text x="424.0" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">where a person works</text>
<rect x="584" y="48" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="684.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Notebooks</text>
<text x="684.0" y="92" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">Python and client library</text>
<rect x="194" y="234" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="294.0" y="259" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Sign-in</text>
<text x="294.0" y="278" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">knows who each person is</text>
<rect x="454" y="234" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="554.0" y="259" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Policy engine</text>
<text x="554.0" y="278" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">decides every request</text>
<rect x="714" y="234" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="814.0" y="259" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">API</text>
<text x="814.0" y="278" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">every request passes here</text>
<rect x="64" y="420" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="164.0" y="445" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Pipelines and jobs</text>
<text x="164.0" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">long jobs run here</text>
<rect x="324" y="420" width="200" height="72" rx="8" fill="#FAEBEB" stroke="#C9564A" stroke-width="1.5"/>
<text x="424.0" y="445" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Custom pipeline steps</text>
<text x="424.0" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">an organisation&#x27;s own code</text>
<rect x="584" y="420" width="200" height="72" rx="8" fill="#FAEBEB" stroke="#C9564A" stroke-width="1.5"/>
<text x="684.0" y="445" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Derivation queries</text>
<text x="684.0" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">run with no network</text>
<rect x="844" y="420" width="200" height="72" rx="8" fill="#FAEBEB" stroke="#C9564A" stroke-width="1.5"/>
<text x="944.0" y="445" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Sandboxed AI agents</text>
<text x="944.0" y="464" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">every tool call is checked</text>
<rect x="194" y="606" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="294.0" y="631" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Object storage</text>
<text x="294.0" y="650" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">one bucket per organisation</text>
<rect x="454" y="606" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="554.0" y="631" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Tables</text>
<text x="554.0" y="650" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">readable with open tools</text>
<rect x="714" y="606" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="814.0" y="631" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Person keys</text>
<text x="814.0" y="650" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">one key per person</text>
<rect x="1132" y="327" width="200" height="72" rx="8" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="1232.0" y="352" font-size="13" font-weight="700" text-anchor="middle" fill="#1C2333">Record of decisions</text>
<text x="1232.0" y="371" font-size="11" font-style="italic" text-anchor="middle" fill="#4B5266">and the reason for each</text>
<text x="40" y="770" font-size="13" font-weight="700" fill="#1C2333">Legend</text>
<rect x="40" y="787" width="26" height="16" rx="4" fill="#E1EEFC" stroke="#1A5FA8" stroke-width="1.5"/>
<text x="86" y="799" font-size="12" fill="#1C2333">A service the platform runs</text>
<rect x="40" y="813" width="26" height="16" rx="4" fill="#FAEBEB" stroke="#C9564A" stroke-width="1.5"/>
<text x="86" y="825" font-size="12" fill="#1C2333">A place with restricted reach: it has no route to the internet</text>
<rect x="40" y="839" width="26" height="16" rx="4" fill="#DDEEF0" stroke="#2E7D8A" stroke-width="1.5"/>
<text x="86" y="851" font-size="12" fill="#1C2333">A layer</text>
<text x="40" y="877" font-size="12" font-weight="700" fill="#1C2333">API</text>
<text x="86" y="877" font-size="12" fill="#1C2333">Application Programming Interface, the one place every request goes through</text>
</svg>
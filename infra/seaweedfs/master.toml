# How many storage volumes SeaweedFS creates at a time.
#
# Read this before changing the number, because the key names are the
# storage engine's own and they explain nothing on their own.
#
# WHAT A VOLUME IS
#
# SeaweedFS does not keep each stored object as its own file on disk. It
# appends many objects into a few large files, and one of those large files
# is a "volume". On disk a volume is three files: `<name>.dat` holding the
# data, `<name>.idx` indexing which object sits at which offset, and a tiny
# `.vif` of metadata. A volume grows up to `-master.volumeSizeLimitMB`
# (1 GB here) and then stops accepting writes, and a new one is made.
#
# WHY THIS FILE EXISTS
#
# Every tenant bucket is its own SeaweedFS "collection", and volumes are
# never shared between collections. When the first object is written for a
# collection that has none, the master does not create one volume. It
# creates a batch, all at once, and spreads writes across them.
#
# The size of that batch is what the keys below set, and the default batch
# is SEVEN. Seven volumes per tenant, reserved on that tenant's first write,
# whether it then stores a gigabyte or fifty bytes. With `-volume.max=100`
# that is a ceiling of about fourteen tenants holding data at once, and the
# failure when the pool runs out is an S3 `InternalError` on write that
# names neither volumes nor the pool. It reads like broken storage. It cost
# a verification run and an hour before the cause was found, and the
# response at the time was to raise `-volume.max` from 20 to 100, which
# treated the symptom.
#
# Volumes cost slots, not disk: `-master.volumePreallocate=false` means a
# volume file grows into its 1 GB limit rather than reserving it up front,
# so an unused volume is a few kilobytes on disk. The constraint is the
# count, never the space.
#
# WHAT THE KEY NAMES MEAN
#
# The batch size is chosen by how many copies of each object are kept, and
# the keys are named after the copy count rather than after anything a
# reader would recognise:
#
#   copy_1      no replication, one copy of each object   <- this install
#   copy_2      two copies
#   copy_3      three copies
#   copy_other  any other replication setting
#
# This install runs a single SeaweedFS node with no replication, so `copy_1`
# is the only key that has any effect here. The others are left at their
# defaults for the day this runs replicated, and are inert until then.
#
# WHY ONE
#
# Tenants here are many and small. One volume is 1 GB of headroom, which no
# tenant on this platform has approached, and a tenant that does fill it is
# given another automatically. The cost of being wrong in this direction is
# a brief pause while a volume is created. The cost of being wrong in the
# other direction is every write on the machine failing with a message that
# explains nothing.
#
# A tenant expected to be large is given more at onboarding instead, by
# name, rather than by making every tenant pay for it: see
# `initial_storage_volumes` in scripts/admin/onboarding-template.json and
# MUNITAS_STORAGE_VOLUMES_PER_TENANT in platform/api/app/config.py.

[master.volume_growth]
copy_1 = 1
copy_2 = 6
copy_3 = 3
copy_other = 1

# The gateway a custom pipeline step reaches the platform through. A step runs on an internal network with no route to the internet, and this is the only
# other thing on it. It forwards the platform's step routes and answers 404 to everything else, so a step cannot reach the platform's other routes, the
# database, storage or any other service by way of it.
worker_processes 1;
events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;
  # A step sends short requests, except for one part of a file it writes, which is at most 8 MiB.
  client_max_body_size 1m;

  # The platform's address is looked up again as requests arrive (Docker's own resolver, answers kept for five seconds), not once when this
  # starts. A fixed address goes stale the moment the API container is recreated, and every step then fails to reach the platform.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    set $platform http://munitas-api:8000;

    location /step/v1/outputs/ {
      client_max_body_size 9m;
      proxy_pass $platform;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host munitas-api;
      proxy_read_timeout 120s;
    }

    location /step/v1/ {
      proxy_pass $platform;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host munitas-api;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    location = /healthz { return 200 "ok
"; }
    location / { return 404; }
  }
}
